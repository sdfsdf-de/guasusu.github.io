<!DOCTYPE html>
<html>
<head>
<style>
:root {
  --deep-blue: #1a1a2e;
  --neon-cyan: #00b4d8;
  --neon-pink: #ff6b6b;
  --text-light: #e6f1ff;
}

body {
  background: var(--deep-blue);
  color: var(--text-light);
  font-family: 'Segoe UI', sans-serif;
  line-height: 1.6;
  padding: 2rem;
  margin: 0;
}

/* 工作室标题 */
.studio-title {
  text-align: center;
  margin-bottom: 3rem;
}

.studio-name {
  font-size: 2.5rem;
  letter-spacing: 4px;
  background: linear-gradient(135deg, var(--neon-cyan) 30%, var(--neon-pink) 70%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: glow 2s ease-in-out infinite alternate;
}

@keyframes glow {
  from { text-shadow: 0 0 10px rgba(0,180,216,0.5), 0 0 20px rgba(255,107,107,0.3); }
  to { text-shadow: 0 0 20px rgba(0,180,216,0.8), 0 0 30px rgba(255,107,107,0.5); }
}

/* 价格表 */
.price-table {
  max-width: 1200px;
  margin: 0 auto;
  display: grid;
  gap: 1.5rem;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
}

.service-card {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 12px;
  padding: 2rem;
  transition: transform 0.3s;
}

.service-card:hover {
  transform: translateY(-5px);
}

/* 对话框样式 */
.modal {
  display: none;
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: var(--deep-blue);
  border: 2px solid var(--neon-cyan);
  border-radius: 15px;
  padding: 2rem;
  z-index: 1000;
  width: 90%;
  max-width: 400px;
  box-shadow: 0 0 30px rgba(0,180,216,0.3);
}

.modal-content {
  position: relative;
}

.close {
  position: absolute;
  top: -15px;
  right: -15px;
  color: var(--neon-pink);
  font-size: 1.5rem;
  cursor: pointer;
  background: var(--deep-blue);
  border-radius: 50%;
  width: 30px;
  height: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* 其余样式保持不变... */
</style>
</head>
<body>

<!-- 对话框 -->
<div id="contactModal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">&times;</span>
    <h3 style="color: var(--neon-cyan);">📱 立即联系</h3>
    <p>我是<span style="color: var(--neon-pink);">光溯视觉工作室-豆豆</span></p>
    <p>📧 wangchuang024@qq.com</p>
    <p>📞 150-4038-2221</p>
    <img src="https://cli.im/api/qrcode/code?text=http%3A%2F%2Fweixin.qq.com%2Fr%2FzjhMVD3E9XCLrWlO93_H&mhid=505" 
         style="width: 150px; margin-top: 1rem;">
  </div>
</div>

<!-- 页面内容 -->
<div class="studio-title">
  <h1 class="studio-name">光溯视觉工作室</h1>
</div>

<div class="price-table">
  <!-- 服务卡片内容保持不变 -->
  <!-- ... -->
  <a href="javascript:void(0)" class="cta-button" onclick="showModal()">立即咨询</a>
</div>

<script>
// 弹窗控制
function showModal() {
  document.getElementById("contactModal").style.display = "block";
}

function closeModal() {
  document.getElementById("contactModal").style.display = "none";
}

// 点击外部关闭
window.onclick = function(event) {
  const modal = document.getElementById('contactModal');
  if (event.target == modal) {
    closeModal();
  }
}
</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<style>
